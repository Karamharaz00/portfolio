<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الباقات — كرم حراز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="packs">

<nav class="nav" id="nav"></nav>

<section class="prj-hero wrap" style="padding-bottom:20px;text-align:center">
  <span class="sec-num">02 — <span data-i18n="sec_packs_n"></span></span>
  <h1 class="prj-title rv" data-i18n="sec_packs_t"></h1>
  <p class="prj-desc rv rv-d1" style="margin-inline:auto" data-i18n="sec_packs_d"></p>
</section>

<section class="sec wrap" style="padding-top:30px">
  <div class="pack-grid" id="packGrid"></div>

  <!-- قواعد التعامل -->
  <div class="rules-sec rv" id="packRules"></div>

  <!-- طرق الدفع -->
  <div class="pay-sec">
    <div class="pay-title rv"><span>💳</span><span data-i18n="pay_t"></span></div>
    <div class="pay-grid">
      <div class="pay-card rv rv-d1"><div class="ic">💳</div><div class="nm" data-i18n="pay0"></div><div class="ds" data-i18n="pay0d"></div></div>
      <div class="pay-card rv rv-d1"><div class="ic">📱</div><div class="nm" data-i18n="pay1"></div><div class="ds" data-i18n="pay1d"></div></div>
      <div class="pay-card rv rv-d2"><div class="ic">🏦</div><div class="nm" data-i18n="pay2"></div><div class="ds" data-i18n="pay2d"></div></div>
      <div class="pay-card rv rv-d3"><div class="ic">💸</div><div class="nm" data-i18n="pay3"></div><div class="ds" data-i18n="pay3d"></div></div>
      <div class="pay-card rv rv-d4"><div class="ic">🌍</div><div class="nm" data-i18n="pay4"></div><div class="ds" data-i18n="pay4d"></div></div>
    </div>
    <div class="pay-note rv" data-i18n="pay_note"></div>
  </div>
</section>

<!-- فورم التواصل -->
<section class="sec wrap" id="contact" style="padding-top:20px">
  <div id="contactHost"></div>
</section>

<!-- CTA -->
<section class="sec wrap" style="padding-top:10px">
  <div class="cta rv">
    <h2 data-i18n="cta_t"></h2>
    <p data-i18n="cta_p"></p>
    <a class="btn-main pack-order" target="_blank" rel="noopener"><span data-i18n="cta_wa"></span></a>
  </div>
</section>

<footer id="foot"></footer>

<script src="assets/app.js"></script>
<script>
  document.querySelectorAll('.pack-order').forEach(a=>a.href=WA);
</script>
</body>
</html>
