<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كرم حراز — مصمم سوشيال ميديا وإعلانات</title>
<meta name="description" content="كرم حراز — مصمم جرافيك متخصص في السوشيال ميديا والإعلانات. أكثر من 5 سنوات خبرة مع براندات في مصر والسعودية والخليج.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ping+AR+LT:wght@300;400;500;700;900&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ============ نظام التصميم ============ */
:root{
  --bg:#0c0c0e;
  --bg2:#131316;
  --txt:#f9f9f9;
  --mut:rgba(249,249,249,.62);
  --mut2:rgba(249,249,249,.4);
  --acc:#ff5a1f;
  --amber:#ffb020;
  --gold:#f2c14e;
  --line:rgba(255,255,255,.09);
  --glass:linear-gradient(155deg,rgba(255,255,255,.075),rgba(255,255,255,.02) 62%);
  --font-ar:"Ping AR + LT","IBM Plex Sans Arabic",-apple-system,"Segoe UI",sans-serif;
  --font-en:"Space Grotesk","Ping AR + LT",sans-serif;
  --font-mono:"IBM Plex Mono",monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--txt);font-family:var(--font-ar);
  overflow-x:hidden;line-height:1.7;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--acc);color:#fff}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#2c2c31;border-radius:20px}
::-webkit-scrollbar-thumb:hover{background:var(--acc)}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font-family:inherit}

/* التوهج المحيط */
body::before{
  content:"";position:fixed;top:-140px;inset-inline-start:8%;width:84%;height:42px;
  background:linear-gradient(270deg,#ff5a1f,#dd9620,#f2c14e,#ff784b,#ff5a1f);
  background-size:1000% 1000%;filter:blur(40px);opacity:.18;transform:scale(6);
  animation:orbDrift 30s ease infinite;pointer-events:none;z-index:0;
}
@keyframes orbDrift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}

/* خلفية النقاط التفاعلية */
#arcCanvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.55}

.wrap{max-width:1200px;margin-inline:auto;padding-inline:24px;position:relative;z-index:2}

/* زجاج */
.glass{
  background:var(--glass);
  border:1px solid var(--line);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border-radius:24px;
}

/* ============ الناف ============ */
.nav{
  position:fixed;top:0;inset-inline:0;z-index:100;
  background:rgba(12,12,14,.72);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  border-bottom:1px solid var(--line);
}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:14px;height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:19px;letter-spacing:-.3px;white-space:nowrap}
.logo-mark{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--acc),var(--amber));
  font-family:var(--font-en);font-weight:700;font-size:15px;color:#fff;
  box-shadow:0 8px 22px #ff5a1f44;transition:transform .4s cubic-bezier(.34,1.56,.64,1);
}
.logo:hover .logo-mark{transform:rotate(-8deg) scale(1.08)}
.nav-links{display:flex;align-items:center;gap:6px}
.nav-links a{
  padding:8px 16px;border-radius:12px;font-size:14.5px;font-weight:500;color:var(--mut);
  transition:.3s;position:relative;
}
.nav-links a:hover,.nav-links a.on{color:var(--txt);background:rgba(255,255,255,.06)}
.nav-cta{display:flex;align-items:center;gap:10px}
.lang-btn{
  font-family:var(--font-mono);font-size:12px;padding:8px 13px;border-radius:11px;
  border:1px solid var(--line);color:var(--mut);transition:.3s;
}
.lang-btn:hover{color:var(--txt);border-color:rgba(255,255,255,.3)}
.nav-wa{
  display:inline-flex;align-items:center;gap:8px;padding:9px 18px;border-radius:12px;
  background:linear-gradient(135deg,var(--acc),#ff7a3d);color:#fff;font-weight:700;font-size:13.5px;
  box-shadow:0 8px 24px #ff5a1f3a;transition:.35s cubic-bezier(.34,1.56,.64,1);
}
.nav-wa:hover{transform:translateY(-2px);box-shadow:0 14px 32px #ff5a1f55}
.nav-wa svg{width:16px;height:16px}

/* ============ الهيرو ============ */
.hero{
  min-height:100svh;display:grid;grid-template-columns:1.15fr .85fr;gap:44px;
  align-items:center;padding-top:120px;padding-bottom:70px;
}
.hero-txt{display:flex;flex-direction:column;gap:22px}
.hero-label{
  display:inline-flex;align-items:center;gap:9px;width:fit-content;
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.4px;color:var(--mut);
  border:1px solid var(--line);padding:7px 15px;border-radius:40px;background:rgba(255,255,255,.03);
}
.hero h1{
  font-size:clamp(44px,7.2vw,86px);font-weight:900;line-height:1.08;letter-spacing:-1px;
}
.accent{
  background:linear-gradient(to right,#ff5a1f 20%,#ffb020 38%,#f2c14e 50%,#ff784b 68%,#ff5a1f 82%);
  background-size:500% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:textShine 5s ease-in-out infinite alternate;
}
@keyframes textShine{to{background-position:100% center}}
.role-rot{
  display:flex;align-items:center;gap:14px;direction:ltr;justify-content:flex-start;
  font-family:var(--font-en);font-size:clamp(14px,1.6vw,19px);font-weight:600;color:var(--amber);
  min-height:28px;
}
html[dir="rtl"] .role-rot{justify-content:flex-end}
.role-line{width:34px;height:1.5px;background:linear-gradient(90deg,transparent,var(--acc));flex-shrink:0}
.role-line:last-child{background:linear-gradient(90deg,var(--acc),transparent)}
#roleRot{transition:opacity .38s,filter .38s,transform .38s;display:inline-block}
#roleRot.swap-out{opacity:0;filter:blur(5px);transform:translateY(6px)}
.hero-sub{color:var(--mut);font-size:16.5px;max-width:54ch;font-weight:400}

.hero-stats{display:flex;gap:34px;flex-wrap:wrap;padding-block:6px}
.stat .num{
  font-family:var(--font-en);font-size:clamp(30px,3.4vw,44px);font-weight:700;line-height:1;
  background:linear-gradient(135deg,#fff,#ffb9a0);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.stat .num em{font-style:normal;color:var(--acc);-webkit-text-fill-color:var(--acc)}
.stat .lbl{font-size:13px;color:var(--mut2);margin-top:7px;font-weight:400}

.hero-actions{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.btn-main{
  position:relative;display:inline-flex;align-items:center;gap:10px;overflow:hidden;
  padding:15px 32px;border-radius:15px;font-weight:700;font-size:15.5px;color:#fff;
  background:linear-gradient(135deg,var(--acc),#ff7a3d);
  box-shadow:0 12px 34px #ff5a1f40;transition:.35s cubic-bezier(.34,1.56,.64,1);
}
.btn-main::after{ /* لمعة كريستال */
  content:"";position:absolute;top:0;bottom:0;width:55%;left:-70%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  transform:skewX(-18deg);transition:none;
}
.btn-main:hover{transform:translateY(-3px);box-shadow:0 20px 44px #ff5a1f59}
.btn-main:hover::after{left:120%;transition:left .7s ease}
.btn-ghost{
  display:inline-flex;align-items:center;gap:9px;padding:14px 28px;border-radius:15px;
  border:1px solid var(--line);font-weight:600;font-size:15px;color:var(--txt);
  background:rgba(255,255,255,.03);transition:.35s;
}
.btn-ghost:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.07);transform:translateY(-2px)}

.socials{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.s-lbl{font-family:var(--font-mono);font-size:11px;color:var(--mut2);margin-inline-end:6px}
.soc{
  width:40px;height:40px;border-radius:13px;display:grid;place-items:center;
  border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--mut);
  transition:.4s cubic-bezier(.34,1.56,.64,1);
}
.soc svg{width:17px;height:17px;fill:currentColor;transition:.4s}
.soc:hover{
  color:#fff;border-color:var(--acc);background:#ff5a1f14;
  transform:translateY(-5px) rotate(-6deg);box-shadow:0 12px 26px #ff5a1f30;
}
.soc:hover svg{transform:scale(1.15)}

.hero-photo{position:relative}
.hero-photo .ph{
  border-radius:30px;overflow:hidden;position:relative;
  border:1px solid var(--line);
  box-shadow:0 34px 90px rgba(0,0,0,.55);
}
.hero-photo .ph::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(200deg,transparent 55%,rgba(12,12,14,.55));
}
.hero-photo img{width:100%;height:100%;object-fit:cover;aspect-ratio:4/4.6}
.ph-badge{
  position:absolute;bottom:20px;inset-inline-start:20px;z-index:3;
  padding:12px 20px;border-radius:17px;display:flex;flex-direction:column;gap:2px;
  background:rgba(15,15,17,.6);border:1px solid rgba(255,255,255,.14);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.ph-badge b{font-size:14.5px}
.ph-badge span{font-family:var(--font-mono);font-size:10.5px;color:var(--amber);direction:ltr;text-align:end}
.ph-ring{
  position:absolute;top:-26px;inset-inline-end:-26px;width:120px;height:120px;z-index:0;
  border-radius:50%;border:1.5px dashed rgba(255,176,32,.5);
  animation:spin 16s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ الماركي ============ */
.marquee-sec{padding-block:34px;position:relative;z-index:2}
.marquee{
  overflow:hidden;padding-block:9px;
  -webkit-mask-image:linear-gradient(to left,transparent,#000 8%,#000 92%,transparent);
  mask-image:linear-gradient(to left,transparent,#000 8%,#000 92%,transparent);
}
.marquee-track{display:flex;gap:16px;width:max-content;animation:mq 46s linear infinite}
.marquee.rev .marquee-track{animation-direction:reverse;animation-duration:54s}
.marquee:hover .marquee-track{animation-play-state:paused}
@keyframes mq{to{transform:translateX(-50%)}}
.mq-item{
  width:190px;height:126px;border-radius:17px;overflow:hidden;flex-shrink:0;
  border:1px solid var(--line);transition:.4s;
}
.mq-item img{width:100%;height:100%;object-fit:cover;filter:saturate(.92)}
.mq-item:hover{transform:scale(1.05);border-color:rgba(255,176,32,.4)}

/* ============ الأقسام ============ */
.sec{padding-block:64px;position:relative;z-index:2}
.sec-head{
  display:flex;justify-content:space-between;align-items:flex-end;gap:26px;
  margin-bottom:40px;flex-wrap:wrap;
}
.sec-num{
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:1.5px;color:var(--mut2);
  display:block;margin-bottom:12px;
}
.sec-title{font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.5px;line-height:1.25}
.sec-desc{color:var(--mut);max-width:46ch;font-size:15px}

/* ============ كروت المشاريع ============ */
.pj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.pj-card{position:relative;display:block}
.pj-cover{
  border-radius:22px;overflow:hidden;border:1px solid var(--line);position:relative;
  aspect-ratio:4/3;background:var(--bg2);
}
.pj-cover img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.16,1,.3,1)}
.pj-card:hover .pj-cover img{transform:scale(1.07)}
.pj-num{
  position:absolute;top:14px;inset-inline-start:16px;z-index:2;
  font-family:var(--font-mono);font-size:11px;color:rgba(255,255,255,.85);
  background:rgba(12,12,14,.55);backdrop-filter:blur(8px);
  padding:5px 11px;border-radius:30px;border:1px solid rgba(255,255,255,.14);
}
.pj-body{
  position:relative;z-index:3;margin:-44px 18px 0;padding:18px 20px;
  border-radius:19px;background:rgba(19,19,22,.82);
  border:1px solid var(--line);border-top:2.5px solid var(--pc,var(--acc));
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
  transition:.45s cubic-bezier(.34,1.56,.64,1);
}
.pj-card:hover .pj-body{transform:translateY(-6px) rotate(-.5deg);border-top-color:var(--pc)}
.pj-name{font-family:var(--font-en);font-weight:700;font-size:17px;direction:ltr;text-align:start}
.pj-cat{font-size:12.5px;color:var(--mut);margin-top:2px}
.pj-arrow{
  width:38px;height:38px;border-radius:12px;flex-shrink:0;display:grid;place-items:center;
  border:1px solid var(--line);color:var(--mut);transition:.4s cubic-bezier(.34,1.56,.64,1);
}
.pj-arrow svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2}
.pj-card:hover .pj-arrow{background:var(--acc);border-color:var(--acc);color:#fff;transform:rotate(-45deg)}

/* ============ المميزات ============ */
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.feat-card{
  padding:30px 24px;position:relative;overflow:hidden;
  transition:.45s cubic-bezier(.34,1.56,.64,1);
}
.feat-card::before{
  content:"";position:absolute;top:0;inset-inline:0;height:2.5px;
  background:linear-gradient(90deg,var(--acc),var(--amber));
  transform:scaleX(0);transform-origin:center;transition:transform .5s;
}
.feat-card:hover{transform:translateY(-8px);border-color:rgba(255,255,255,.18)}
.feat-card:hover::before{transform:scaleX(1)}
.f-ic{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;margin-bottom:20px;
  background:linear-gradient(135deg,#ff5a1f22,#ffb02011);border:1px solid #ff5a1f2e;
  transition:.5s cubic-bezier(.34,1.56,.64,1);
}
.f-ic svg{width:24px;height:24px;stroke:var(--amber);fill:none;stroke-width:1.8;transition:.5s}
.feat-card:hover .f-ic{transform:rotate(-10deg) scale(1.12);background:linear-gradient(135deg,#ff5a1f38,#ffb02022)}
.feat-card:hover .f-ic svg{stroke:var(--acc)}
.f-t{font-weight:700;font-size:16.5px;margin-bottom:9px}
.f-d{font-size:13.5px;color:var(--mut);line-height:1.8}

/* ============ الباقات ============ */
.pack-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;align-items:stretch}
.pack{
  padding:36px 30px;display:flex;flex-direction:column;gap:0;position:relative;
  transition:.5s cubic-bezier(.34,1.56,.64,1);
}
.pack:hover{transform:translateY(-9px);border-color:rgba(255,255,255,.2)}
.pack.gold{
  border-color:rgba(242,193,78,.35);transform:translateY(-8px);
  box-shadow:0 30px 80px rgba(242,193,78,.09),0 20px 60px rgba(0,0,0,.4);
}
.pack.gold:hover{transform:translateY(-17px)}
.tier-medal{font-size:30px;margin-bottom:16px;display:inline-block;transition:.5s cubic-bezier(.34,1.56,.64,1)}
.pack:hover .tier-medal{transform:scale(1.2) rotate(-8deg)}
.pack-flag{
  position:absolute;top:-13px;inset-inline-start:26px;
  font-size:11.5px;font-weight:700;padding:6px 15px;border-radius:30px;
  background:linear-gradient(135deg,var(--acc),#ff7a3d);color:#fff;
  box-shadow:0 8px 22px #ff5a1f44;
}
.pack-flag.goldf{background:linear-gradient(135deg,#dd9620,var(--gold));color:#231a05;box-shadow:0 8px 22px #f2c14e33}
.pack-name{font-size:20px;font-weight:900;margin-bottom:4px}
.tier-bronze .pack-name{color:#d29d6e}
.tier-silver .pack-name{color:#c3cede}
.tier-gold .pack-name{color:var(--gold)}
.pack-count{
  font-family:var(--font-en);font-size:52px;font-weight:700;line-height:1.1;direction:ltr;text-align:start;
  background:linear-gradient(135deg,#fff,#ffd9c7);-webkit-background-clip:text;background-clip:text;color:transparent;
}
.pack-count small{font-size:15px;color:var(--mut2);-webkit-text-fill-color:var(--mut2);font-family:var(--font-ar);font-weight:400}
.pack-price{
  font-size:16px;font-weight:700;margin:6px 0 22px;
  background:linear-gradient(to right,#ff5a1f 20%,#ffb020 50%,#ff5a1f 80%);
  background-size:300% auto;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:textShine 6s ease-in-out infinite alternate;
}
.pack-feats{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:20px;flex:1}
.pack-feats li{display:flex;gap:11px;align-items:flex-start;font-size:14px;color:var(--mut)}
.pack-feats li::before{
  content:"✓";color:var(--tc,var(--acc));font-weight:900;flex-shrink:0;font-size:13px;margin-top:2px;
}
.tier-bronze{--tc:#d29d6e}.tier-silver{--tc:#c3cede}.tier-gold{--tc:#f2c14e}
.pack-fit{
  font-size:12.5px;color:var(--mut2);border-top:1px dashed var(--line);
  padding-top:16px;margin-bottom:20px;line-height:1.8;
}
.pack-order{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:14px;border-radius:14px;font-weight:700;font-size:14.5px;
  border:1px solid var(--line);background:rgba(255,255,255,.04);transition:.35s;
}
.pack-order:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
.pack.gold .pack-order{
  background:linear-gradient(135deg,#dd9620,var(--gold));color:#231a05;border:0;
  box-shadow:0 12px 30px #f2c14e2e;
}
.pack.gold .pack-order:hover{box-shadow:0 18px 40px #f2c14e44}

/* ============ الفورم ============ */
.form-card{padding:44px;max-width:760px;margin-inline:auto}
.form-head{text-align:center;margin-bottom:34px}
.form-head h2{font-size:clamp(24px,3vw,34px);font-weight:900;margin-bottom:10px}
.form-head p{color:var(--mut);font-size:14.5px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.fgroup{display:flex;flex-direction:column;gap:8px}
.fgroup label{font-size:13px;font-weight:600;color:var(--mut)}
.field2{
  background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:14px;
  padding:14px 17px;color:var(--txt);font-size:14.5px;outline:0;transition:.3s;width:100%;
}
.field2:focus{border-color:var(--acc);background:rgba(255,255,255,.07);box-shadow:0 0 0 4px #ff5a1f18}
textarea.field2{resize:vertical;min-height:120px}
select.field2{appearance:none;cursor:pointer}
select.field2 option{background:var(--bg2);color:var(--txt)}
.hp{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);opacity:0;pointer-events:none}
.cap-row{display:flex;align-items:center;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.cap-q{
  font-family:var(--font-en);font-weight:700;font-size:17px;direction:ltr;
  padding:11px 19px;border-radius:13px;background:rgba(255,176,32,.09);
  border:1px solid rgba(255,176,32,.28);color:var(--amber);
}
.cap-row .field2{width:110px;text-align:center;font-family:var(--font-en)}
.form-note{font-size:13.5px;margin-bottom:14px;display:none;padding:12px 16px;border-radius:12px}
.form-note.err{display:block;background:#ff4d4d14;border:1px solid #ff4d4d38;color:#ff9a9a}
.form-note.ok{display:block;background:#3ddc8420;border:1px solid #3ddc8440;color:#8ff0bc}
#reqForm .btn-main{width:100%;justify-content:center;font-size:16px;padding:17px}

/* ============ الدفع ============ */
.pay-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-bottom:26px}
.pay-card{
  padding:24px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;
  transition:.4s cubic-bezier(.34,1.56,.64,1);
}
.pay-card:hover{transform:translateY(-6px);border-color:rgba(255,255,255,.2)}
.pay-ic{
  width:50px;height:50px;border-radius:15px;display:grid;place-items:center;
  background:rgba(255,255,255,.05);border:1px solid var(--line);transition:.45s cubic-bezier(.34,1.56,.64,1);
}

.pay-btn{

}
.pay-btn::after{
  content:"";position:absolute;top:0;bottom:0;width:50%;left:-65%;

.pay-btn:hover::after{left:115%;transition:left .65s ease}

/* ---------- الراوتر ---------- */
function route(){
  const h = location.hash || '#/';
  const parts = h.replace('#/','').split('/');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  let pg = 'home';
  if(parts[0]==='work') pg='work';
  else if(parts[0]==='packs') pg='packs';
  else if(parts[0]==='project'){ pg='project'; renderProject(parts[1]); }
  const el = document.getElementById('pg-'+pg);
  if(el) el.classList.add('on');
  document.querySelectorAll('.nav-links a').forEach(a=>{
    a.classList.toggle('on', a.dataset.pg === pg || (pg==='project' && a.dataset.pg==='work'));
  });
  window.scrollTo({top:0});
  bindReveal();
  setTimeout(()=>document.querySelectorAll('.rv').forEach(el2=>el2.classList.add('in')), 900);
}

/* ---------- المحتوى ---------- */
let roleTimer=null, featTimer=null;
function pjCard(p,i){
  return `<a class="pj-card rv" style="--pc:${p.color}" href="#/project/${p.id}">
    <div class="pj-cover"><span class="pj-num">${String(i+1).padStart(2,'0')}</span>
      <img src="assets/projects/${p.id}/1.jpg" loading="lazy" alt="${p.n}"></div>
    <div class="pj-body"><div>
      <div class="pj-name">${p.n}</div>
      <div class="pj-cat">${LANG==='ar'?p.cAr:p.cEn}</div>
    </div><span class="pj-arrow">${ICONS.arrow}</span></div>
  </a>`;
}

const FEATS=[['zap','f1t','f1d'],['gem','f2t','f2d'],['target','f3t','f3d'],['hand','f4t','f4d']];
const PACKS=[
  {n:1,medal:'🥉',tier:'bronze',count:6,price:400,feats:['f1_1','f1_2','f1_3','f1_4'],fit:'fit1',flag:''},
  {n:2,medal:'🥈',tier:'silver',count:12,price:600,feats:['f2_1','f2_2','f2_3','f2_4'],fit:'fit2',flag:'hot'},
  {n:3,medal:'🥇',tier:'gold',count:30,price:1500,feats:['f3_1','f3_2','f3_3','f3_4'],fit:'fit3',flag:'vip'},
];
const PAYS=[['wallet','pay1','pay1d'],['card','pay2','pay2d'],['bank','pay3','pay3d'],['globe','pay4','pay4d']];
const PAY_BTNS=[
  {k:'paypal',cls:'pp',ic:'card',lbl:'pay_pp',wa:'أهلًا كرم، عاوز أدفع عن طريق PayPal 💳'},
  {k:'stripe',cls:'st',ic:'card',lbl:'pay_st',wa:'أهلًا كرم، عاوز أدفع بالبطاقة (فيزا/ماستركارد) 💳'},
  {k:'lemonsqueezy',cls:'ls',ic:'card',lbl:'pay_ls',wa:'أهلًا كرم، عاوز أدفع عن طريق Lemon Squeezy 🍋'},
];

function buildDynamic(){
  /* الأدوار */
  const rot = document.getElementById('roleRot');
  if(rot){
    if(roleTimer) clearInterval(roleTimer);
    const roles = t('roles'); let ri=0;
    rot.textContent = roles[0];
    roleTimer = setInterval(()=>{
      rot.classList.add('swap-out');
      setTimeout(()=>{ ri=(ri+1)%roles.length; rot.textContent=roles[ri]; rot.classList.remove('swap-out'); },380);
    },2600);
  }
  /* الكيرفات */
  const tracks = document.querySelectorAll('.marquee-track');
  const rows=[[1,2,3],[4,5,6]];
  tracks.forEach((track,ti)=>{
    let imgs=[]; rows[ti%2].forEach(r=>PROJECTS.forEach(p=>imgs.push(`assets/projects/${p.id}/${r}.jpg`)));
    const half = imgs.map(src=>`<div class="mq-item"><img src="${src}" loading="lazy" alt="design"></div>`).join('');
    track.innerHTML = half+half;
  });
  /* المختارة */
  const fg = document.getElementById('featGrid');
  if(fg){
    if(featTimer) clearInterval(featTimer);
    let off=0;
    const draw=()=>{ fg.innerHTML=[0,1,2].map(i=>{const idx=(off+i)%PROJECTS.length;return pjCard(PROJECTS[idx],idx);}).join(''); bindReveal(); };
    draw();
    featTimer=setInterval(()=>{
      fg.classList.add('fade-out');
      setTimeout(()=>{ off=(off+3)%PROJECTS.length; draw(); fg.classList.remove('fade-out'); },520);
    },4500);
  }
  /* كل الأعمال */
  const grid=document.getElementById('pjGrid');
  if(grid) grid.innerHTML = PROJECTS.map((p,i)=>pjCard(p,i)).join('');
  /* المميزات */
  const fc=document.getElementById('featCards');
  if(fc) fc.innerHTML = FEATS.map((f,i)=>`<div class="feat-card glass rv rv-d${i+1}"><div class="f-ic">${ICONS[f[0]]}</div><div class="f-t">${t(f[1])}</div><div class="f-d">${t(f[2])}</div></div>`).join('');
  /* الباقات */
  const pk=document.getElementById('packGrid');
  if(pk) pk.innerHTML = PACKS.map(p=>`
    <div class="pack glass tier-${p.tier} ${p.tier==='gold'?'gold':''} rv">
      ${p.flag?`<span class="pack-flag ${p.tier==='gold'?'goldf':''}">${t(p.flag)}</span>`:''}
      <span class="tier-medal">${p.medal}</span>
      <div class="pack-name">${t('pack'+p.n)}</div>
      <div class="pack-count">${p.count} <small>${t('posts_m')}</small></div>
      <div class="pack-price">${p.price} ${t('sar')}</div>
      <ul class="pack-feats">${p.feats.map(f=>`<li>${t(f)}</li>`).join('')}</ul>
      <div class="pack-fit"><b>${t('fit_l')}</b> ${t(p.fit)}</div>
      <a class="pack-order" href="#/packs" data-pack="${p.n}">${t('order')} ${ICONS.arrow.replace('<svg','<svg style="width:15px;height:15px;stroke:currentColor"')}</a>
    </div>`).join('');
  document.querySelectorAll('.pack-order').forEach(b=>b.addEventListener('click',e=>{
    e.preventDefault();
    const sel=document.getElementById('rqPack'); if(sel) sel.value=b.dataset.pack;
    document.getElementById('orderForm').scrollIntoView({behavior:'smooth'});
    setTimeout(()=>document.getElementById('rqName').focus(),700);
  }));
  /* طرق الدفع */
  const pg=document.getElementById('payGrid');
  if(pg) pg.innerHTML = PAYS.map(p=>`<div class="pay-card glass rv"><div class="pay-ic">${ICONS[p[0]]}</div><b>${t(p[1])}</b><span>${t(p[2])}</span></div>`).join('');
  const pb=document.getElementById('payBtns');
  if(pb) pb.innerHTML = PAY_BTNS.map(b=>{
    const link = PAY_LINKS[b.k];
    const href = link && link.trim() ? link : 'https://wa.me/'+WA_NUM+'?text='+encodeURIComponent(b.wa);
    return `<a class="pay-btn ${b.cls}" href="${href}" target="_blank" rel="noopener">${ICONS[b.ic]}${t(b.lbl)}</a>`;
  }).join('');
}

/* ---------- صفحة المشروع ---------- */
function renderProject(id){
  const i = PROJECTS.findIndex(p=>p.id===id);
  if(i<0) return;
  const p = PROJECTS[i];
  document.getElementById('prjNum').textContent = String(i+1).padStart(2,'0')+' / '+String(PROJECTS.length).padStart(2,'0');
  document.getElementById('prjTitle').textContent = p.n;
  document.getElementById('prjCat').innerHTML = `<span class="chip">${LANG==='ar'?p.cAr:p.cEn}</span><span class="chip" style="font-family:var(--font-mono);direction:ltr">2025 — 2026</span>`;
  document.getElementById('prjDesc').textContent = LANG==='ar'?p.dAr:p.dEn;
  const be = document.getElementById('beBtn');
  be.href = BE; be.innerHTML = ICONS.behance.replace('<svg','<svg style="width:17px;height:17px;fill:currentColor"')+' '+t('prj_be');
  document.getElementById('prjGrid').innerHTML = [1,2,3,4,5,6].map(n=>
    `<img src="assets/projects/${p.id}/${n}.jpg" loading="lazy" alt="${p.n} ${n}" onerror="this.style.display='none'">`).join('');
  const prev = PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length];
  const next = PROJECTS[(i+1)%PROJECTS.length];
  document.getElementById('prjPrev').href = '#/project/'+prev.id;
  document.getElementById('prjPrev').textContent = '→ '+prev.n;
  document.getElementById('prjNext').href = '#/project/'+next.id;
  document.getElementById('prjNext').textContent = next.n+' ←';
}

function applyLang(){

}

/* ---------- العدادات ---------- */
function bindCounters(){
  const io2 = new IntersectionObserver(es=>es.forEach(e=>{
    if(!e.isIntersecting) return;
    io2.unobserve(e.target);
    const to = +e.target.dataset.to, dur = 1600, t0 = performance.now();
    (function tick(now){
      const k = Math.min(1,(now-t0)/dur), ease = 1-Math.pow(1-k,3);
      e.target.textContent = Math.round(to*ease);
      if(k<1) requestAnimationFrame(tick);
    })(t0);
  }),{threshold:.4});
  document.querySelectorAll('.cnt').forEach(el=>io2.observe(el));
}

/* ---------- الظهور ---------- */
let io;
function bindReveal(){
  if(io) io.disconnect();
  io = new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
  }),{threshold:.08});
  document.querySelectorAll('.rv:not(.in)').forEach(el=>io.observe(el));
}

/* ---------- خلفية النقاط التفاعلية (Predictive Arc) ---------- */
(function(){
  const cv = document.getElementById('arcCanvas'), ctx = cv.getContext('2d');
  let W,H,dpr, mx=-9999, my=0;
  function size(){ dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; }
  size(); addEventListener('resize',size);
  addEventListener('pointermove',e=>{ mx=e.clientX; my=e.clientY; });
  let tm=0;
  (function loop(){
    tm+=0.012; ctx.clearRect(0,0,cv.width,cv.height);
    const cell=26*dpr;
    const peak=H*0.32, amp=H*0.13;
    for(let gx=cell/2; gx<W*dpr; gx+=cell){
      const x=gx/dpr;
      const nx=(x-W*0.5)/(W*0.75);
      let cy=(peak+nx*nx*amp);
      const mdx=x-mx;
      const inf=0.55*Math.exp(-(mdx*mdx)/(2*140*140));
      cy=cy*(1-inf)+my*inf;
      for(let gy=cell/2; gy<H*dpr; gy+=cell){
        const y=gy/dpr;
        const dist=Math.abs(y-cy);
        const th=120;
        if(dist>th) continue;
        let it=(1-dist/th)*Math.max(0,1-Math.pow(Math.abs(nx),2.4));
        it*= 0.75+0.25*Math.sin(x*0.015+tm)*Math.cos(y*0.02+tm);
        if(it<=0.03) continue;
        const r=(1+it*3.2)*dpr;
        const a=Math.min(1,it*1.5);
        ctx.beginPath(); ctx.arc(gx,gy,r,0,7);
        ctx.fillStyle = it>0.72 ? `rgba(242,193,78,${a})` : `rgba(255,90,31,${a*0.75})`;
        ctx.fill();
      }
    }
    requestAnimationFrame(loop);
  })();
})();
